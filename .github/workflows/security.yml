# Quét lỗ hổng dependency định kỳ (hardening). Chạy hằng tuần + khi chạy tay + khi đổi lockfile.
# Hiện CHỈ BÁO CÁO (continue-on-error). Sau khi nâng Astro 7 chỉ còn lỗi low/moderate; khi sạch hẳn thì bỏ
# continue-on-error để job đỏ khi có lỗ hổng high/critical mới.
name: Security

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["apps/web/pnpm-lock.yaml", "apps/web/package.json"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: pnpm audit (production deps, high+)
        run: pnpm audit --prod --audit-level high
