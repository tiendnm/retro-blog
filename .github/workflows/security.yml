# Quét lỗ hổng dependency định kỳ (hardening). Chạy hằng tuần + khi chạy tay + khi đổi lockfile.
# Quét TOÀN BỘ deps (cả dev: chạy trong CI) ở mức high+; job đỏ khi có lỗ hổng high/critical mới.
# (2026-11-01: đã sạch high+ nhờ pnpm.overrides fast-uri trong apps/web/package.json; còn 1 low esbuild, không chặn.)
name: Security

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["apps/web/pnpm-lock.yaml", "apps/web/package.json"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: pnpm audit (mọi deps, high+)
        run: pnpm audit --audit-level high
