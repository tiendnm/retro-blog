# CI — Sprint 7 Phase 3, mở rộng Sprint 11. Ba job (phương án lai):
#   quality     : cổng tĩnh + test + header Caddy (nhanh, BẮT BUỘC)
#   build       : (BẮT BUỘC từ Sprint 13) dựng Directus + Postgres + seed (minimal + showcase) rồi `astro build`; kiểm quyền Public và
#                 luồng publish → build trên Directus thật; đẩy dist/ làm artifact (tích hợp end-to-end).
#   site-checks : (cần artifact dist) link/sitemap/canonical/RSS, E2E Playwright + axe, Lighthouse — không cần Directus.
#   site-checks KHÔNG chặn merge (continue-on-error) cho tới khi xanh 10 lần liên tiếp trên main, rồi đặt làm required (docs/14 §4).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # apps/web có lockfile riêng (khớp Dockerfile) → cài độc lập, không theo workspace gốc.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm exec biome lint .
      - run: pnpm exec biome format .
      - run: pnpm typecheck
      - run: pnpm test
      # Test hạ tầng (webhook rebuild) — Node thuần, không cần cài deps.
      - name: Compose config hợp lệ (prod + tunnel)
        working-directory: .
        run: docker compose --env-file .env.production.example config -q
      - name: Shellcheck (script triển khai & vận hành)
        working-directory: .
        run: shellcheck -S warning -x --source-path=SCRIPTDIR scripts/*.sh scripts/lib/*.sh services/ops/*.sh services/rebuild/*.sh services/directus/apply-permissions.sh
      - name: Ops tests (webhook)
        working-directory: .
        run: node --test services/rebuild/webhook.test.mjs
      - name: Test script kiểm site (check-site)
        working-directory: .
        run: node --test scripts/check-site.test.mjs
      # Sprint 13 §C: Caddy thật + Caddyfile thật (non-root, cap_drop ALL) → khẳng định header bảo mật trên 200/404/502.
      # Image lấy từ docker-compose.prod.yml nên PR Dependabot nâng Caddy được kiểm tự động.
      - name: Hồi quy header bảo mật (Caddy)
        working-directory: .
        run: bash scripts/test-caddy-headers.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PASSWORD: ci-only-postgres
      DIRECTUS_KEY: ci-only-key-0123456789abcdef0123456789abcdef
      DIRECTUS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password
      DIRECTUS_URL: http://localhost:8055
      DIRECTUS_INTERNAL_URL: http://localhost:8055
      # HTTPS giả: để check-site bắt `localhost`/`http://` lọt vào dist (chỉ ảnh hưởng URL nhúng trong HTML).
      PUBLIC_DIRECTUS_URL: https://cms.example.test
      PUBLIC_SITE_URL: https://blog.example.test
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: retro-blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # Directus: cùng image pin như docker-compose.yml. --network host để tới Postgres service.
      - name: Start Directus
        run: |
          docker run -d --name directus --network host \
            -e KEY="$DIRECTUS_KEY" -e SECRET="$DIRECTUS_SECRET" \
            -e DB_CLIENT=pg -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=retro-blog -e DB_USER=postgres -e DB_PASSWORD="$DB_PASSWORD" \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e PUBLIC_URL="$DIRECTUS_URL" \
            -v "$PWD/services/directus/snapshots:/directus/snapshots:ro" \
            directus/directus:11.17.4
      - name: Wait for Directus healthy
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8055/server/health >/dev/null 2>&1; then echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "Directus không healthy"; docker logs directus | tail -50; exit 1

      # Tái dùng bootstrap đã version-control (giống cơ chế deploy): schema → permissions → seed tối thiểu.
      - name: Apply schema
        run: docker exec directus npx directus schema apply --yes /directus/snapshots/schema.yaml
      - name: Apply permissions
        run: bash services/directus/apply-permissions.sh
      # Cài deps web TRƯỚC seed: seed dùng `marked` từ apps/web (services/directus/lib/md-to-html.mjs).
      - name: Install web deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Seed (minimal)
        run: node services/directus/seed/seed-dev.mjs
      # Showcase: 20 bài có ảnh + thẻ — để E2E/axe/Lighthouse có ảnh, lightbox, phân trang, trang /tag/*.
      - name: Seed (showcase)
        run: node services/directus/seed/seed-showcase.mjs --yes
      - name: Build (astro build)
        working-directory: apps/web
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: apps/web/dist
          retention-days: 3
          if-no-files-found: error

      # Kiểm cấu hình quyền + luồng publish → build trên Directus thật (Sprint 11 §E). Chạy TUẦN TỰ (dùng chung tiền tố bài thử).
      # Đỏ vì lộ dữ liệu = dừng và báo Product (cổng bảo mật).
      - name: Quyền Public + luồng publish → build
        run: node --test --test-concurrency=1 scripts/integration/

      - name: Directus logs (on failure)
        if: failure()
        run: docker logs directus | tail -100

  site-checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chưa chặn merge cho tới khi ổn định 10 lần liên tiếp (Sprint 11 → bắt buộc ở Sprint 13).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: apps/web/dist

      # A. Link nội bộ, sitemap ⇄ dist, canonical, RSS, JSON-LD, localhost/http (Node thuần).
      - name: Kiểm cấu trúc site
        run: node scripts/check-site.mjs apps/web/dist --site-url=https://blog.example.test --report=check-site-report.txt

      - name: Cài công cụ e2e
        working-directory: e2e
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Cache trình duyệt Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Cài Chromium (kèm thư viện hệ thống)
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # B + D. E2E, axe (WCAG 2.2 AA), bàn phím — desktop + mobile.
      - name: E2E + axe (Playwright)
        working-directory: e2e
        run: pnpm exec playwright test

      # C. Lighthouse (mobile) — ngân sách ở mức warn; bảng số liệu ghi vào tóm tắt của lần chạy.
      - name: Lighthouse CI
        working-directory: e2e
        run: |
          CHROME_PATH="$(node -e "import('@playwright/test').then(m=>console.log(m.chromium.executablePath()))")"
          export CHROME_PATH
          LH_RUNS=1 pnpm exec lhci autorun
      - name: Tóm tắt Lighthouse
        if: always()
        working-directory: e2e
        run: |
          if [ -d .lighthouseci ]; then
            { echo "### Lighthouse (mobile)"; node lh-summary.mjs; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Báo cáo link ngoài + kết quả (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-checks-reports
          retention-days: 7
          path: |
            check-site-report.txt
            e2e/.lighthouseci
      - name: Ảnh chụp lỗi + trace Playwright (khi fail)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          retention-days: 7
          path: |
            e2e/test-results
            e2e/playwright-report
