# ── Cloudflare Tunnel override (Sprint 9 — ADR-0015) ──────────────────────────
# Chạy server TẠI NHÀ, KHÔNG mở cổng ra internet: cloudflared dựng kết nối ra Cloudflare,
# Cloudflare terminate TLS rồi đẩy HTTP vào Caddy (http://caddy:80) qua tunnel.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tunnel.yml \
#     --env-file .env.production up -d
# Cần trong .env.production: TUNNEL_TOKEN, SITE_ADDRESS=http://<SITE_DOMAIN>, CMS_ADDRESS=http://<CMS_DOMAIN>.
# Public hostnames của tunnel (cấu hình trong Cloudflare dashboard) đều trỏ về http://caddy:80;
# Caddy định tuyến theo Host nên giữ nguyên header bảo mật/CSP như chế độ TLS trực tiếp.
name: retro-blog

services:
  caddy:
    # Không publish 80/443 ra host: truy cập duy nhất đi qua tunnel.
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    # http2 (TCP) thay QUIC: bộ đệm UDP của host nhỏ (208 kiB < 7168 kiB cloudflared muốn) → QUIC dễ rớt gói.
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    # DNS công cộng: cloudflared tra bản ghi SRV (region1.v2.argotunnel.com); DNS nhúng của Docker
    # chuyển tiếp lên router nhà, nhiều router không xử lý SRV → "server misbehaving", container restart mãi.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # Image đã chạy nonroot (65532); bỏ capability, chặn leo quyền.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?cần TUNNEL_TOKEN (Cloudflare Zero Trust → Networks → Tunnels)}
    depends_on:
      - caddy
    networks:
      - retro-net

  ops:
    environment:
      # Healthcheck kiểm site/Directus thẳng vào Caddy (HTTP nội bộ, kèm header Host); đường công khai chỉ
      # còn probe "/" có thử lại — đường nhà→Cloudflare từng mất gói làm báo DOWN giả (2026-11-03).
      HEALTHCHECK_ORIGIN_URL: http://caddy
