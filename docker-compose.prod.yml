# ── Production override (Sprint 6 — ADR-0007/0008; Sprint 9 — ADR-0014/0015) ──
# Dùng CÙNG base (KHÔNG đụng docker-compose.yml dev):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.production up -d
# Chạy sau Cloudflare Tunnel (không mở cổng): thêm -f docker-compose.tunnel.yml (xem file đó).
#
# Topology: Caddy (edge) → site tĩnh (/srv/site) + Directus (cms). Postgres chạy TRONG compose
# (ADR-0014, thay ADR-0010 cho production) — không publish cổng, chỉ nội bộ retro-net.
# - web = build-runner + receiver webhook (ADR-0008, ADR-0016): build lần đầu → volume site_dist (Caddy phục vụ),
#   rồi lắng nghe POST /rebuild từ Directus (chỉ trong mạng compose, KHÔNG publish cổng).
# - ops = backup hằng ngày + healthcheck (ADR-0017): không docker.sock, mount chỉ-đọc, chạy bằng uid của user triển khai.
# - directus: KHÔNG publish cổng ra host; chỉ tới được trong mạng compose (Caddy, ops). Public qua Caddy.
name: retro-blog

services:
  # ─── Content Store (ADR-0004/0014) ───
  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    # Tinh chỉnh cho máy nhỏ (≈4 GB RAM, HDD): ít kết nối, bộ đệm vừa phải.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=512MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - retro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  directus:
    # Không publish cổng ra host (public đi qua Caddy; script vận hành chạy trong `ops` gọi http://directus:8055).
    ports: !reset []
    # Lần đầu Directus chạy toàn bộ migration trên DB trống (>2 phút, lâu hơn trên máy yếu) — start_period dài để --wait không báo unhealthy sớm.
    healthcheck:
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      # CORS cho site domain (browser trang site gọi asset/API Directus).
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${PUBLIC_SITE_URL}
      # Cookie đăng nhập chỉ đi qua HTTPS (trình duyệt luôn thấy HTTPS: Caddy TLS hoặc Cloudflare edge).
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      SESSION_COOKIE_SECURE: "true"

  # Web = build-runner + receiver (ADR-0008/0016): web-entrypoint.sh build lần đầu (astro build →
  # staging builds/<TS> → ATOMIC SWAP symlink `current`, build-swap.sh), rồi chạy webhook.mjs;
  # Directus Flow POST http://web:9000/rebuild → chạy lại build-swap.sh. Không cần host/systemd.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: retro-web:prod
    restart: unless-stopped
    command: ["sh", "/rebuild/web-entrypoint.sh"]
    environment:
      REBUILD_TOKEN: ${REBUILD_TOKEN:?cần REBUILD_TOKEN (>= 32 ký tự, openssl rand -hex 32)}
      REBUILD_PORT: ${REBUILD_PORT:-9000}
      DIRECTUS_INTERNAL_URL: ${DIRECTUS_INTERNAL_URL}
      PUBLIC_DIRECTUS_URL: ${PUBLIC_DIRECTUS_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      KEEP_BUILDS: ${KEEP_BUILDS:-5}
      # Máy nhỏ: giới hạn heap Node để astro build không ăn hết RAM.
      NODE_OPTIONS: ${BUILD_NODE_OPTIONS:---max-old-space-size=1536}
    # Thay bind-mount dev bằng volume output (nguồn baked trong image) + script swap.
    volumes: !override
      - site_dist:/out
      - ./services/rebuild:/rebuild:ro
    # Không publish cổng nào ra host (receiver chỉ tới được trong mạng compose).
    ports: !reset []
    # Healthy = đã có bản build đầu tiên (`current`) VÀ receiver đang lắng nghe. start_period dài cho máy yếu (J1900).
    healthcheck: !override
      test:
        - CMD-SHELL
        - >-
          test -L /out/current && node -e
          "require('net').connect(Number(process.env.REBUILD_PORT||9000),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s
    depends_on:
      directus:
        condition: service_healthy

  # Vận hành định kỳ (ADR-0017): scheduler.sh → backup.sh (03:30) + healthcheck.sh (5 phút). Cũng dùng cho tác vụ
  # chạy một lần khi dựng server:  docker compose run --rm ops <lệnh>  (node, bash, curl, pg_dump có sẵn).
  ops:
    build:
      context: ./services/ops
      dockerfile: Dockerfile
    image: retro-ops:prod
    restart: unless-stopped
    # Ghi file backup bằng đúng uid/gid của user triển khai → đọc/chép được không cần sudo.
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    working_dir: /repo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Postgres qua mạng compose (pg_dump), không docker exec.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDB: ${DB_DATABASE}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      UPLOADS_DIR: /data/uploads
      ENV_FILE: .env.production
      # Backup ra ngoài máy (Cloudflare R2, rclone). R2_BUCKET trống → không đẩy.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_KEEP: ${R2_KEEP:-30}
      # Healthcheck đi theo đường công khai (qua Cloudflare/tunnel) để bắt cả lỗi ingress.
      SITE_URL: ${HEALTHCHECK_SITE_URL:-https://${SITE_DOMAIN}}
      CMS_URL: ${HEALTHCHECK_CMS_URL:-https://${CMS_DOMAIN}}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      HEALTHCHECK_INTERVAL: ${HEALTHCHECK_INTERVAL:-300}
      # Dùng cho tác vụ một lần (apply-*.mjs, apply-permissions.sh) khi chạy trong container.
      DIRECTUS_URL: http://directus:8055
    volumes:
      - .:/repo:ro
      - directus_uploads:/data/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - retro-net
    healthcheck:
      # Còn sống = vòng lặp đã ghi heartbeat trong 3 phút qua.
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/ops-alive 2>/dev/null || echo 0) )) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Caddy edge: TLS tự động (hoặc HTTP sau Cloudflare Tunnel), phục vụ static, proxy Directus.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      directus:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Địa chỉ lắng nghe của Caddy: mặc định = domain (auto-TLS). Tunnel override thành http://<domain>.
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_DOMAIN}}
      CMS_ADDRESS: ${CMS_ADDRESS:-${CMS_DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site_dist:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - retro-net

volumes:
  pgdata:
  site_dist:
  caddy_data:
  caddy_config:
