# ── Production override (Sprint 6 — ADR-0007/0008) ─────────────────────────
# Dùng CÙNG base (KHÔNG đụng docker-compose.yml dev):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.production up -d
#
# Topology: Caddy (edge, TLS) → site tĩnh (/srv/site) + Directus (cms).
# - web = build-runner MỘT LẦN: astro build → volume site_dist (Caddy phục vụ). ADR-0008.
# - directus: KHÔNG public trực tiếp (chỉ bind localhost server, debug); public qua Caddy.
# - postgres: giữ như base (không expose ra host).
name: retro-blog

services:
  directus:
    # Ghi đè: chỉ bind localhost trên server (public đi qua Caddy, không expose 0.0.0.0).
    ports: !override
      - "127.0.0.1:${DIRECTUS_PORT}:8055"
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      # CORS cho site domain (browser trang site gọi asset/API Directus).
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${PUBLIC_SITE_URL}

  # Web = build-runner (ADR-0008): astro build → /out (volume site_dist) rồi THOÁT.
  # Rebuild-on-publish (Phase 3) chạy lại job này + atomic swap.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: retro-web:prod
    restart: "no"
    command: ["sh", "-c", "pnpm build && rm -rf /out/* && cp -a dist/. /out/ && echo 'build -> site_dist OK'"]
    environment:
      DIRECTUS_INTERNAL_URL: ${DIRECTUS_INTERNAL_URL}
      PUBLIC_DIRECTUS_URL: ${PUBLIC_DIRECTUS_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    # Thay bind-mount dev bằng volume output (nguồn baked trong image).
    volumes: !override
      - site_dist:/out
    # Không publish cổng dev, không healthcheck (job chạy-1-lần).
    ports: !reset []
    healthcheck: !reset {}
    depends_on:
      directus:
        condition: service_healthy

  # Caddy edge: TLS tự động, phục vụ static, proxy Directus.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_completed_successfully
      directus:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site_dist:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - retro-net

volumes:
  site_dist:
  caddy_data:
  caddy_config:
